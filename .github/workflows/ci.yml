name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy pipeline
      - name: Tests (lake, quality, dbt, idempotency, backfill, extract)
        run: pytest --cov=pipeline --cov-report=term-missing --cov-fail-under=85

  spark:
    # Engine parity: Spark 4 must produce the same hourly aggregates as DuckDB.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" "pyspark>=4,<5"
      - run: pytest -m spark -v

  airflow:
    # Load the DAG with real Airflow, then execute one full run in-process.
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: /tmp/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
      LAKE_ROOT: /tmp/run/lake
      WAREHOUSE_PATH: /tmp/run/warehouse/t.duckdb
      REPORTS_ROOT: /tmp/run/reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pipeline in its own virtualenv (as in the Docker image)
        run: |
          python -m venv /tmp/pipeline-venv
          /tmp/pipeline-venv/bin/pip install .
          echo "PIPELINE_BIN=/tmp/pipeline-venv/bin/pipeline" >> "$GITHUB_ENV"
      - name: Airflow in its own virtualenv
        run: |
          python -m venv /tmp/airflow-venv
          /tmp/airflow-venv/bin/pip install "apache-airflow==3.3.2" pytest
      - name: DAG integrity tests
        run: /tmp/airflow-venv/bin/python -m pytest -q tests/test_dag.py
      - name: Execute one DAG run
        run: |
          /tmp/airflow-venv/bin/airflow db migrate
          /tmp/airflow-venv/bin/airflow dags test telemetry_daily 2026-09-05
          test -f /tmp/run/reports/dbt/target/run_results.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t telemetry-pipeline-airflow:ci .
      - name: Pipeline CLI works inside the image
        run: docker run --rm --entrypoint /opt/pipeline/venv/bin/pipeline telemetry-pipeline-airflow:ci --help
