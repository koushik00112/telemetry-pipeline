[project]
name = "telemetry-pipeline"
version = "0.1.0"
description = "Batch pipeline for device telemetry: Parquet lake, Spark/DuckDB transforms, dbt models, Airflow."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pyarrow>=16",
    "duckdb>=1.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "dbt-core>=1.9,<1.10",
    "dbt-duckdb>=1.8,<2",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
pipeline = "pipeline.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt/target", "dbt/dbt_packages"]

[tool.ruff.lint.isort]
known-third-party = ["airflow"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "S608"]  # S608: SQL built from validated identifiers/paths, see lake.py

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "S311", "S108"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: needs PySpark and a JVM", "dbt: runs dbt"]
